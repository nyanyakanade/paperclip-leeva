name: Leeva customization checks

on:
  push:
    branches: [leeva]
  pull_request:
    branches: [leeva]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customization:
    if: github.repository == 'nyanyakanade/paperclip-leeva'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/leeva/*.test.mjs
      - run: pnpm --filter '@paperclipai/ui^...' build
      - run: pnpm --filter @paperclipai/ui exec vitest run src/i18n src/pages/ProfileSettings.test.tsx src/components/SidebarAccountMenu.test.tsx
      - run: pnpm --filter @paperclipai/ui typecheck
      - run: pnpm check:token-gates
      - run: pnpm --filter @paperclipai/ui build
